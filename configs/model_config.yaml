# ============================================================
# 模型配置 (Model Configuration)
# 姿态估计模型权重与推理参数
# 优先级: 内置默认值 < 本文件 < 命令行参数
# ============================================================

pose_model:
  # 模型权重路径（相对项目根目录或绝对路径）
  name: "yolo26n-pose.pt"
  # 人/姿态检测置信度阈值
  conf_thresh: 0.35
  # 推理设备: null = 自动 (有 GPU 用 cuda, 否则 cpu); 或固定 "cpu" / "cuda"
  device: null
  # 推理输入尺寸 (320/480/640)。越小 CPU 推理越快, 但小目标精度下降。
  # 0 = 根据源分辨率自动 (min(640, 源最大边 * 0.85))
  imgsz: 640
  # torch CPU 线程数。小姿态模型并行效率差, 1-4 通常优于全核; 0 = 自动
  num_threads: 0
  # 有效检测过滤: 可见关节数下限（低于则丢弃该检测）
  min_visible_joints: 4
  # 有效检测过滤: 单个关节的置信度下限
  keypoint_conf: 0.35
  # 有效检测过滤: 边界框最小宽度 (像素)
  min_bbox_w: 20
  # 有效检测过滤: 边界框最小高度 (像素)
  min_bbox_h: 30
